[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "efflint"
version = "0.1.0"
description = "A local-first efficiency linter for LLM and agent workloads."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
    { name = "EffLint Contributors" }
]

keywords = [
    "llm",
    "ai",
    "agents",
    "tokens",
    "observability",
    "efficiency",
    "linting"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License"
]

dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5"
]

[project.scripts]
efflint = "efflint.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/efflint"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"